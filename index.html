<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Runner: Ultimate Custom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #8A2BE2; --neon-alt: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; }
        
        /* UI 元件 */
        .overlay { position: absolute; inset: 0; z-index: 8000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        .panel { padding: 30px; text-align: center; border-radius: 15px; border: 2px solid var(--neon); background: rgba(0,0,0,0.9); width: 80%; max-width: 400px; }
        
        /* 暫停/商城選單 */
        #shop-menu { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.95); display: none; padding: 20px; overflow-y: auto; }
        .skin-section { margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
        .skin-card { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid #333; }
        
        /* 自定義工具欄 */
        .custom-tool { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        input[type="color"], input[type="file"] { width: 100%; height: 40px; background: #222; border: 1px solid var(--neon); cursor: pointer; }

        .btn-pause { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border: 2px solid var(--neon); color: white; border-radius: 50%; z-index: 1000; cursor: pointer; display: none; }
        .score-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: 900; color: var(--neon); text-shadow: 0 0 15px var(--neon); z-index: 1000; }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay" onclick="handleStart()">
        <h1 style="letter-spacing:8px; color: var(--neon-alt);">NEON RUNNER</h1>
        <p style="animation: blink 1.5s infinite;">CLICK TO START MISSION</p>
    </div>

    <div id="shop-menu">
        <h2 style="text-align:center; color:var(--neon-alt); margin-bottom:20px;">SKIN CUSTOMIZER</h2>
        
        <div class="skin-section">
            <label>1. 上傳角色圖片</label>
            <input type="file" id="img-upload" accept="image/*" onchange="uploadImage(this)">
        </div>

        <div class="skin-section">
            <label>2. 自定義單色</label>
            <input type="color" id="color-picker" onchange="setCustomColor(this.value)">
        </div>

        <div class="skin-section">
            <label>3. 預設高級漸層</label>
            <div class="skin-grid" id="grad-list"></div>
        </div>

        <button onclick="resumeGame()" style="width:100%; padding:15px; background:var(--neon); border:none; color:white; font-weight:bold; border-radius:8px; cursor:pointer;">APPLY & RESUME</button>
    </div>

    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h2 style="color:#ff0055;">CONNECTION LOST</h2>
            <p id="final-score" style="font-size:28px;"></p>
            <button onclick="location.reload()" style="padding:12px 40px; background:var(--neon); border:none; color:white; border-radius:30px; font-weight:bold;">REBOOT SYSTEM</button>
        </div>
    </div>

    <div class="score-ui" id="ui-score">0</div>
    <button class="btn-pause" id="pause-btn" onclick="pauseGame()">||</button>

    <script>
        let scene, camera, renderer, player, animID;
        let isPlaying = false, isPaused = false, isTransitioning = false;
        let score = 0, speed = 0.6, lane = 0, lanes = [-2.2, 0, 2.2];
        let obstacles = [], sideLines = [];

        // 漸層清單
        const GRADIENTS = [
            'linear-gradient(45deg, #ff00cc, #3333ff)',
            'linear-gradient(45deg, #00f2fe, #4facfe)',
            'linear-gradient(45deg, #f093fb, #f5576c)',
            'linear-gradient(45deg, #5eeff9, #4568dc)',
            'linear-gradient(45deg, #8A2BE2, #00ffff)'
        ];

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 15, 70);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 初始：側面視角
            camera.position.set(15, 8, 12);
            camera.lookAt(0, 0, -10);

            // 1. 地地板網格加強 (解決平面不清楚)
            const floorGeo = new THREE.PlaneGeometry(20, 1000);
            const floorMat = new THREE.MeshPhongMaterial({ color: 0x000000, emissive: 0x111111 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(1000, 100, 0x8A2BE2, 0x222222);
            grid.position.y = 0.05;
            scene.add(grid);

            // 2. 復刻：軌道左右邊界光條
            for(let x of [-4.5, 4.5]) {
                const lineGeo = new THREE.BoxGeometry(0.2, 0.2, 1000);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x8A2BE2 });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(x, 0.1, 0);
                scene.add(line);
                sideLines.push(line);
            }

            // 玩家
            player = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshStandardMaterial({ color: 0x8A2BE2, emissive: 0x8A2BE2, emissiveIntensity: 0.5 })
            );
            player.position.y = 0.5;
            scene.add(player);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0x00ffff, 0.8);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            renderGradients();
            loop();
        }

        function handleStart() {
            if(isTransitioning) return;
            isTransitioning = true;
            document.getElementById('start-screen').style.opacity = '0';
            
            const duration = 1500;
            const startPos = { ...camera.position };
            const startTime = performance.now();

            function step(now) {
                const p = Math.min((now - startTime) / duration, 1);
                const t = 1 - Math.pow(1 - p, 3); // Out-cubic ease
                camera.position.x = startPos.x + (0 - startPos.x) * t;
                camera.position.y = startPos.y + (4.5 - startPos.y) * t;
                camera.position.z = startPos.z + (8 - startPos.z) * t;
                camera.lookAt(0, 0, -2);
                if(p < 1) requestAnimationFrame(step);
                else {
                    document.getElementById('start-screen').style.display = 'none';
                    document.getElementById('pause-btn').style.display = 'block';
                    isPlaying = true;
                }
            }
            requestAnimationFrame(step);
        }

        function loop() {
            animID = requestAnimationFrame(loop);
            if(!isPlaying || isPaused) { renderer.render(scene, camera); return; }

            speed += 0.00015;
            player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[lane + 1], 0.25);

            if(Math.random() < 0.05) spawn();

            obstacles.forEach((o, i) => {
                o.position.z += speed;
                if(player.position.distanceTo(o.position) < 0.95) endGame();
                if(o.position.z > 10) { scene.remove(o); obstacles.splice(i, 1); score++; updateUI(); }
            });

            // 邊線流動
            sideLines.forEach(l => l.position.z = (l.position.z + speed) % 50);

            renderer.render(scene, camera);
        }

        function spawn() {
            const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.3 }));
            m.position.set(lanes[Math.floor(Math.random()*3)], 0.6, -80);
            scene.add(m);
            obstacles.push(m);
        }

        // --- 皮膚系統核心 ---
        function setCustomColor(color) {
            player.material = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 });
        }

        function uploadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const loader = new THREE.TextureLoader();
                    const tex = loader.load(e.target.result);
                    player.material = new THREE.MeshBasicMaterial({ map: tex });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderGradients() {
            const list = document.getElementById('grad-list');
            GRADIENTS.forEach(g => {
                const card = document.createElement('div');
                card.className = "skin-card";
                card.style.background = g;
                card.onclick = () => {
                    // 使用 Canvas 捕捉漸層色作為貼圖
                    const canvas = document.createElement('canvas');
                    canvas.width = 256; canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, 256, 256);
                    const colors = g.match(/#[a-fA-F0-9]{6}/g);
                    grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
                    const tex = new THREE.CanvasTexture(canvas);
                    player.material = new THREE.MeshBasicMaterial({ map: tex });
                };
                list.appendChild(card);
            });
        }

        function pauseGame() { isPaused = true; document.getElementById('shop-menu').style.display = 'block'; }
        function resumeGame() { isPaused = false; document.getElementById('shop-menu').style.display = 'none'; }
        function updateUI() { document.getElementById('ui-score').innerText = score; }
        function endGame() { isPlaying = false; document.getElementById('death-screen').style.display = 'flex'; document.getElementById('final-score').innerText = `SCORE: ${score}`; }
    </script>
</body>
</html>
