<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 FR CUBE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 8000; backdrop-filter: blur(8px); }
        .panel { padding: 30px; background: rgba(10,10,10,0.9); border: 2px solid #00ff88; border-radius: 15px; text-align: center; color: white; width: 300px; box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        .btn { width: 100%; padding: 12px; background: #00ff88; border: none; color: #000; cursor: pointer; font-weight: bold; border-radius: 5px; margin-top: 15px; transition: 0.3s; }
        .btn:hover:not(:disabled) { background: #00cc6e; transform: scale(1.02); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; text-align: center; }
        
        .game-ui { position: absolute; top: 20px; left: 20px; z-index: 100; color: #00ff88; font-weight: bold; pointer-events: none; }
        #key-ui { position: absolute; top: 20px; right: 20px; color: #FFD700; font-size: 20px; z-index: 100; }
        #loading-text { color: #888; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 登入與同步畫面 -->
    <div id="auth-screen" class="overlay">
        <div class="panel">
            <h2 style="color:#00ff88; margin-bottom:5px;">2026 FR CUBE</h2>
            <p style="font-size:12px; color:#666; margin-bottom:20px;">FR TECHNOLOGY COMPANY</p>
            <input type="email" id="email-input" placeholder="電子郵件">
            <input type="password" id="pass-input" placeholder="存取密鑰">
            <button class="btn" onclick="handleAuth()">啟動同步連線</button>
            <div id="loading-text">尚未連線至 Firebase</div>
        </div>
    </div>

    <!-- 重生畫面 -->
    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h1 style="color:#ff4444;">中斷</h1>
            <p id="death-stats">分數: 0</p>
            <button id="rebirth-btn" class="btn" onclick="requestRebirth()">使用 🔑 <span id="rebirth-cost">1</span> 重生</button>
            <button class="btn" style="background:#444; color:#fff;" onclick="location.reload()">結算並結束</button>
        </div>
    </div>

    <!-- UI -->
    <div class="game-ui">
        <div>分數: <span id="score-val">0</span></div>
        <div style="color:#00ffff">金幣: <span id="gold-val">0</span></div>
    </div>
    <div id="key-ui">🔑 <span id="key-count">0</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase 配置 (你提供的身分證)
        const firebaseConfig = {
            apiKey: "AIzaSyDFsYaVluzHsQc3dxcTNieu514UdU-mj4A",
            authDomain: "fr-cube.firebaseapp.com",
            projectId: "fr-cube",
            storageBucket: "fr-cube.firebasestorage.app",
            messagingSenderId: "872650518894",
            appId: "1:872650518894:web:5de26c9c9fcfa1b611517f",
            measurementId: "G-0J5D3TSMBC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userDoc = null;
        let isGameActive = false;
        let score = 0, goldCollected = 0, rebirths = 0;

        // 登入/註冊邏輯
        window.handleAuth = async () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('pass-input').value;
            if(!email || !pass) return alert("請輸入完整資訊");
            
            document.getElementById('loading-text').innerText = "正在連線...";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                if(e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), { gold: 0, keys: 20, highScore: 0 });
                } else { alert("錯誤: " + e.message); }
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                userDoc = snap.data();
                document.getElementById('auth-screen').style.display = 'none';
                updateUIDisplay();
                initGame();
            }
        });

        function updateUIDisplay() {
            document.getElementById('key-count').innerText = userDoc.keys;
            document.getElementById('gold-val').innerText = userDoc.gold;
        }

        // --- Three.js 遊戲核心 ---
        let scene, camera, renderer, player, obstacles = [], coins = [], animID;
        let targetLane = 0, currentLane = 0, gameSpeed = 0.6;

        function initGame() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 燈光與地板
            scene.add(new THREE.AmbientLight(0x444444));
            const sun = new THREE.DirectionalLight(0x00ff88, 1);
            sun.position.set(5, 10, 5);
            scene.add(sun);

            const roadGeo = new THREE.PlaneGeometry(10, 1000);
            const roadMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI/2;
            scene.add(road);

            // 玩家 CUBE
            player = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshPhongMaterial({ color: 0x00ff88, emissive: 0x004422 }));
            player.position.y = 0.4;
            scene.add(player);

            camera.position.set(0, 4, 7);
            camera.lookAt(0, 0, 0);

            // 控制
            window.onkeydown = (e) => {
                if(e.key === "ArrowLeft" || e.key === "a") if(targetLane > -1) targetLane--;
                if(e.key === "ArrowRight" || e.key === "d") if(targetLane < 1) targetLane++;
            };
            
            window.ontouchstart = (e) => {
                const x = e.touches[0].clientX;
                if(x < window.innerWidth/2) { if(targetLane > -1) targetLane--; }
                else { if(targetLane < 1) targetLane++; }
            };

            isGameActive = true;
            animate();
        }

        function animate() {
            if(!isGameActive) return;
            animID = requestAnimationFrame(animate);

            gameSpeed += 0.0001;
            player.position.x += (targetLane * 2.5 - player.position.x) * 0.2;
            
            // 生成邏輯
            if(Math.random() < 0.05) spawnObject();

            // 物件更新
            obstacles.forEach((obj, i) => {
                obj.position.z += gameSpeed;
                if(obj.position.z > 10) { scene.remove(obj); obstacles.splice(i, 1); score++; }
                if(player.position.distanceTo(obj.position) < 0.8) gameOver();
            });

            coins.forEach((obj, i) => {
                obj.position.z += gameSpeed;
                obj.rotation.y += 0.1;
                if(obj.position.z > 10) { scene.remove(obj); coins.splice(i, 1); }
                if(player.position.distanceTo(obj.position) < 0.8) {
                    scene.remove(obj); coins.splice(i, 1);
                    goldCollected += 10;
                    document.getElementById('gold-val').innerText = userDoc.gold + goldCollected;
                }
            });

            document.getElementById('score-val').innerText = score;
            renderer.render(scene, camera);
        }

        function spawnObject() {
            const lane = [ -2.5, 0, 2.5 ][Math.floor(Math.random()*3)];
            if(Math.random() > 0.3) {
                const obs = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 1), new THREE.MeshPhongMaterial({ color: 0xff0055 }));
                obs.position.set(lane, 0.5, -60);
                scene.add(obs); obstacles.push(obs);
            } else {
                const coin = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 16), new THREE.MeshPhongMaterial({ color: 0xFFD700 }));
                coin.position.set(lane, 0.5, -60);
                scene.add(coin); coins.push(coin);
            }
        }

        async function gameOver() {
            isGameActive = false;
            cancelAnimationFrame(animID);
            const cost = Math.pow(2, rebirths);
            document.getElementById('death-screen').style.display = 'flex';
            document.getElementById('death-stats').innerText = `本次得分: ${score} | 獲得金幣: ${goldCollected}`;
            document.getElementById('rebirth-cost').innerText = cost;
            
            // 同步金幣到 Firebase
            const userRef = doc(db, "users", auth.currentUser.uid);
            await updateDoc(userRef, { gold: increment(goldCollected) });
            goldCollected = 0;
        }

        window.requestRebirth = async () => {
            const cost = Math.pow(2, rebirths);
            if(userDoc.keys >= cost) {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, { keys: increment(-cost) });
                userDoc.keys -= cost;
                rebirths++;
                updateUIDisplay();
                document.getElementById('death-screen').style.display = 'none';
                
                // 重生無敵效果
                obstacles.forEach(o => scene.remove(o)); obstacles = [];
                isGameActive = true;
                animate();
            } else {
                alert("鑰匙不足！");
            }
        };
    </script>
</body>
</html>
