<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 FR CUBE - Security Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #050505; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; touch-action: none; }
        
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 8000; backdrop-filter: blur(10px); }
        .panel { padding: 35px; background: rgba(15,15,15,0.95); border: 1px solid var(--neon); border-radius: 20px; text-align: center; color: white; width: 320px; box-shadow: 0 0 40px rgba(0,255,136,0.15); }
        
        input { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 14px; }
        input:focus { border-color: var(--neon); outline: none; }
        
        .btn { width: 100%; padding: 14px; background: var(--neon); border: none; color: #000; cursor: pointer; font-weight: bold; border-radius: 8px; margin-top: 10px; transition: 0.2s; font-size: 16px; }
        .btn:hover { background: #00cc6e; transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid #444; color: #aaa; margin-top: 15px; }
        .btn-secondary:hover { border-color: var(--neon); color: var(--neon); }

        .game-ui { position: absolute; top: 25px; left: 25px; z-index: 100; color: var(--neon); font-weight: bold; pointer-events: none; }
        #key-ui { position: absolute; top: 25px; right: 25px; color: #FFD700; font-size: 20px; z-index: 100; }
        .status-msg { font-size: 12px; margin-top: 12px; min-height: 18px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 驗證面板 -->
    <div id="auth-screen" class="overlay">
        <!-- 登入介面 -->
        <div id="login-box" class="panel">
            <h2 style="color:var(--neon); margin:0;">2026 FR CUBE</h2>
            <p style="font-size:10px; color:#555; margin-bottom:20px; letter-spacing: 2px;">AGENT LOGIN</p>
            <input type="email" id="login-email" placeholder="電子郵件">
            <input type="password" id="login-pass" placeholder="存取密鑰">
            <button class="btn" onclick="handleSignIn()">同步連線</button>
            <button class="btn btn-secondary" onclick="toggleAuth(true)">建立新帳號</button>
            <div id="login-status" class="status-msg"></div>
        </div>

        <!-- 註冊介面 -->
        <div id="reg-box" class="panel hidden">
            <h2 style="color:var(--neon); margin:0;">初始化帳號</h2>
            <p style="font-size:10px; color:#555; margin-bottom:20px;">CREATE NEW AGENT</p>
            <input type="email" id="reg-email" placeholder="設定電子郵件">
            <input type="password" id="reg-pass" placeholder="設定 6 位數以上密碼">
            <button class="btn" style="background:#00ffff" onclick="handleSignUp()">確認註冊</button>
            <button class="btn btn-secondary" onclick="toggleAuth(false)">返回登入</button>
            <div id="reg-status" class="status-msg"></div>
        </div>
    </div>

    <!-- [其餘遊戲 UI 與 Three.js 邏輯保持不變] -->
    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h1 style="color:#ff4444;">中斷</h1>
            <button id="rebirth-btn" class="btn" onclick="requestRebirth()">使用 🔑 <span id="rebirth-cost">1</span> 重生</button>
            <button class="btn btn-secondary" onclick="location.reload()">結算並結束</button>
        </div>
    </div>

    <div class="game-ui">
        <div>分數: <span id="score-val">0</span></div>
        <div style="color:#00ffff">金幣: <span id="gold-val">0</span></div>
    </div>
    <div id="key-ui">🔑 <span id="key-count">0</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFsYaVluzHsQc3dxcTNieu514UdU-mj4A",
            authDomain: "fr-cube.firebaseapp.com",
            projectId: "fr-cube",
            storageBucket: "fr-cube.firebasestorage.app",
            messagingSenderId: "872650518894",
            appId: "1:872650518894:web:5de26c9c9fcfa1b611517f",
            measurementId: "G-0J5D3TSMBC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userDoc = null;
        let isGameActive = false;
        let score = 0, goldCollected = 0, rebirths = 0;

        // UI 切換
        window.toggleAuth = (isReg) => {
            document.getElementById('login-box').classList.toggle('hidden', isReg);
            document.getElementById('reg-box').classList.toggle('hidden', !isReg);
            document.getElementById('login-status').innerText = "";
            document.getElementById('reg-status').innerText = "";
        };

        // 【純登入功能】
        window.handleSignIn = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-status');
            
            if(!email || !pass) { msg.innerText = "請完整輸入"; return; }
            msg.style.color = "#888";
            msg.innerText = "連線中...";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                msg.style.color = "#ff4444";
                if(e.code === 'auth/invalid-credential') msg.innerText = "帳號或密碼錯誤";
                else if(e.code === 'auth/user-not-found') msg.innerText = "帳號不存在，請先註冊";
                else msg.innerText = "登入失敗";
            }
        };

        // 【純註冊功能】
        window.handleSignUp = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const msg = document.getElementById('reg-status');

            if(!email || pass.length < 6) { msg.innerText = "信箱格式錯誤或密碼過短"; return; }
            msg.style.color = "#00ffff";
            msg.innerText = "正在初始化代理人檔案...";

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                // 註冊成功才建立資料庫文件
                await setDoc(doc(db, "users", res.user.uid), {
                    gold: 0,
                    keys: 20,
                    highScore: 0,
                    createdAt: new Date()
                });
                msg.innerText = "註冊完成！正在登入...";
            } catch (e) {
                msg.style.color = "#ff4444";
                if(e.code === 'auth/email-already-in-use') msg.innerText = "此信箱已被註冊";
                else msg.innerText = "註冊失敗，請檢查格式";
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    userDoc = snap.data();
                    document.getElementById('auth-screen').style.display = 'none';
                    updateUIDisplay();
                    initGame();
                }
            }
        });

        // [以下維持原本的 Three.js 遊戲邏輯與 updateUIDisplay...]
        // (為了節省篇幅，此處略過重複的 initGame, animate 等代碼，請保留你上一版本的 script 內容)
        // ...
    </script>
</body>
</html>
