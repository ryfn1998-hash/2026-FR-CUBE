<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Runner: Shadow Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #8A2BE2; --neon-alt: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; }
        
        /* UI 層級 */
        .overlay { position: absolute; inset: 0; z-index: 8000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); transition: 0.5s; }
        .panel { padding: 30px; text-align: center; border-radius: 15px; border: 1px solid var(--neon); background: rgba(10,10,10,0.8); }
        
        /* 商城/暫停選單 */
        #shop-menu { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.9); display: none; padding: 40px; }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; height: 60vh; overflow-y: auto; padding: 15px; border: 1px solid #333; }
        .skin-card { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .skin-card:hover { border-color: var(--neon); }
        .skin-card.active { border-color: white; box-shadow: 0 0 15px white; }

        /* 控制按鈕 */
        .btn-pause { position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; background: rgba(255,255,255,0.1); border: 1px solid var(--neon); color: white; border-radius: 50%; z-index: 1000; cursor: pointer; display: none; }
        .score-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: 900; color: var(--neon); text-shadow: 0 0 10px var(--neon); z-index: 1000; }
    </style>
</head>
<body>

    <!-- 側邊視角起始畫面 -->
    <div id="start-screen" class="overlay" onclick="handleStart()">
        <h1 style="letter-spacing:10px; text-shadow: 0 0 20px var(--neon);">NEON RUNNER</h1>
        <p style="color: var(--neon-alt); font-size: 14px; animation: blink 1.5s infinite;">TAP TO SYNC</p>
    </div>

    <!-- 暫停/商城選單 -->
    <div id="shop-menu">
        <h2 style="text-align:center; color:var(--neon-alt);">SYSTEM PAUSED / SKINS</h2>
        <div class="skin-grid" id="skin-list"></div>
        <button onclick="resumeGame()" style="width:100%; margin-top:20px; padding:15px; background:var(--neon); border:none; color:white; font-weight:bold; border-radius:8px;">RESUME MISSION</button>
    </div>

    <!-- 死亡畫面 -->
    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h2 style="color:#ff0055;">LINK BROKEN</h2>
            <p id="final-score" style="font-size:24px;"></p>
            <button onclick="resetGame()" style="padding:10px 30px; background:var(--neon); border:none; color:white; border-radius:5px;">REBOOT</button>
        </div>
    </div>

    <div class="score-ui" id="ui-score">0</div>
    <button class="btn-pause" id="pause-btn" onclick="pauseGame()">||</button>

    <script>
        let scene, camera, renderer, player, animID;
        let isPlaying = false, isPaused = false, isTransitioning = false;
        let score = 0, speed = 0.6, lane = 0, lanes = [-2.2, 0, 2.2];
        let obstacles = [];

        // 皮膚資料 (50種)
        const SKINS = [
            { type: 'img', url: 'https://img.freepik.com/free-vector/abstract-neon-lights-background_23-2148332990.jpg', name: 'CYBER-IMG' },
            ...Array.from({length: 49}, (_, i) => ({
                type: 'color',
                val: `hsl(${(i * 137) % 360}, 70%, 50%)`,
                name: `NEON-${i+1}`
            }))
        ];
        let currentSkin = SKINS[1].val;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 10, 60);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 初始：側面視角
            camera.position.set(12, 6, 10);
            camera.lookAt(0, 0, -5);

            // 玩家
            const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const mat = new THREE.MeshStandardMaterial({ color: currentSkin, emissive: currentSkin, emissiveIntensity: 0.5 });
            player = new THREE.Mesh(geo, mat);
            player.position.y = 0.5;
            scene.add(player);

            // 環境與燈光
            scene.add(new THREE.GridHelper(200, 40, 0x8A2BE2, 0x111111));
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const pLight = new THREE.PointLight(0x8A2BE2, 1, 50);
            pLight.position.set(0, 5, 5);
            scene.add(pLight);

            // 控制
            const move = (dir) => { if(!isPlaying || isPaused) return; lane = Math.max(-1, Math.min(1, lane + dir)); };
            window.addEventListener('keydown', e => {
                if(e.key === "ArrowLeft") move(-1); if(e.key === "ArrowRight") move(1);
            });
            renderer.domElement.addEventListener('touchstart', e => {
                move(e.touches[0].clientX < window.innerWidth/2 ? -1 : 1);
            });

            renderShop();
            loop();
        }

        // 側視圖轉正中央的動畫
        function handleStart() {
            if(isTransitioning) return;
            isTransitioning = true;
            document.getElementById('start-screen').style.opacity = '0';
            
            const targetPos = { x: 0, y: 4, z: 7 };
            const duration = 1200;
            const startPos = { ...camera.position };
            const startTime = performance.now();

            function step(now) {
                const p = (now - startTime) / duration;
                if(p < 1) {
                    camera.position.x = startPos.x + (targetPos.x - startPos.x) * p;
                    camera.position.y = startPos.y + (targetPos.y - startPos.y) * p;
                    camera.position.z = startPos.z + (targetPos.z - startPos.z) * p;
                    camera.lookAt(0, 0, -2);
                    requestAnimationFrame(step);
                } else {
                    camera.position.set(0, 4, 7);
                    document.getElementById('start-screen').style.display = 'none';
                    document.getElementById('pause-btn').style.display = 'block';
                    isPlaying = true;
                    isTransitioning = false;
                }
            }
            requestAnimationFrame(step);
        }

        function loop() {
            animID = requestAnimationFrame(loop);
            if(!isPlaying || isPaused) {
                renderer.render(scene, camera);
                return;
            }

            speed += 0.0001;
            player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[lane + 1], 0.2);

            if(Math.random() < 0.04) spawn();

            obstacles.forEach((o, i) => {
                o.position.z += speed;
                if(player.position.distanceTo(o.position) < 0.9) endGame();
                if(o.position.z > 10) { scene.remove(o); obstacles.splice(i, 1); score++; updateUI(); }
            });

            renderer.render(scene, camera);
        }

        function spawn() {
            const m = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), new THREE.MeshStandardMaterial({ color: 0x00ffff }));
            m.position.set(lanes[Math.floor(Math.random()*3)], 0.5, -60);
            scene.add(m);
            obstacles.push(m);
        }

        // 商城與皮膚切換
        function renderShop() {
            const list = document.getElementById('skin-list');
            SKINS.forEach((s, i) => {
                const card = document.createElement('div');
                card.className = "skin-card";
                if(s.type === 'color') card.style.background = s.val;
                else card.style.backgroundImage = `url(${s.url})`;
                card.onclick = () => setSkin(s);
                list.appendChild(card);
            });
        }

        function setSkin(s) {
            if(s.type === 'color') {
                player.material = new THREE.MeshStandardMaterial({ color: s.val, emissive: s.val, emissiveIntensity: 0.5 });
            } else {
                const loader = new THREE.TextureLoader();
                const tex = loader.load(s.url);
                player.material = new THREE.MeshBasicMaterial({ map: tex });
            }
            document.querySelectorAll('.skin-card').forEach(c => c.classList.remove('active'));
            resumeGame();
        }

        function pauseGame() { isPaused = true; document.getElementById('shop-menu').style.display = 'block'; }
        function resumeGame() { isPaused = false; document.getElementById('shop-menu').style.display = 'none'; }
        function updateUI() { document.getElementById('ui-score').innerText = score; }
        function endGame() { isPlaying = false; document.getElementById('death-screen').style.display = 'flex'; document.getElementById('final-score').innerText = `SCORE: ${score}`; }
        function resetGame() { location.reload(); }
    </script>
</body>
</html>
