<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 FR CUBE - Store Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #050505; --glass: rgba(15, 15, 15, 0.95); }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; }
        
        /* 介面與面板 */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 8000; backdrop-filter: blur(10px); }
        .panel { padding: 30px; background: var(--glass); border: 1px solid var(--neon); border-radius: 20px; text-align: center; width: 320px; }
        
        /* 商店選單 */
        #shop-panel { position: absolute; top: 100px; right: 20px; width: 180px; background: var(--glass); border: 1px solid #00ffff; padding: 15px; border-radius: 10px; display: none; z-index: 500; }
        .shop-item { background: #111; border: 1px solid #333; padding: 8px; margin: 5px 0; border-radius: 5px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .shop-item:hover { border-color: var(--neon); }
        
        /* 按鈕與輸入 */
        input { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center; }
        .btn { width: 100%; padding: 12px; background: var(--neon); border: none; color: #000; cursor: pointer; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        .btn-shop { position: absolute; bottom: 30px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: #00ffff; border: none; cursor: pointer; font-size: 24px; z-index: 1000; }

        .game-ui { position: absolute; top: 25px; left: 25px; z-index: 100; color: var(--neon); font-weight: bold; }
        #key-ui { position: absolute; top: 25px; right: 25px; color: #FFD700; font-size: 20px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 驗證系統 -->
    <div id="auth-screen" class="overlay">
        <div id="login-box" class="panel">
            <h2 style="color:var(--neon);">2026 FR CUBE</h2>
            <input type="email" id="login-email" placeholder="信箱">
            <input type="password" id="login-pass" placeholder="密碼">
            <button class="btn" onclick="handleSignIn()">同步連線</button>
            <button class="btn" style="background:transparent; border:1px solid #444; color:#aaa; margin-top:10px;" onclick="toggleAuth(true)">註冊新帳號</button>
        </div>
        <div id="reg-box" class="panel hidden">
            <h2 style="color:#00ffff;">初始化帳號</h2>
            <input type="email" id="reg-email" placeholder="信箱">
            <input type="password" id="reg-pass" placeholder="密碼 (至少6位)">
            <button class="btn" style="background:#00ffff" onclick="handleSignUp()">確認註冊</button>
            <button class="btn" style="background:transparent; border:1px solid #444; color:#aaa; margin-top:10px;" onclick="toggleAuth(false)">返回登入</button>
        </div>
    </div>

    <!-- 商店介面 -->
    <button id="shop-btn" class="btn-shop hidden" onclick="toggleShop()">🛒</button>
    <div id="shop-panel">
        <h3 style="color:#00ffff; margin-top:0;">皮膚商店</h3>
        <div class="shop-item" onclick="buySkin('emerald', 500)">翡翠幽靈 (500💰)</div>
        <div class="shop-item" onclick="buySkin('gold', 2000)">量子金煌 (2000💰)</div>
        <div class="shop-item" onclick="buySkin('shadow', 1000)">暗影之紫 (1000💰)</div>
        <p style="font-size:10px; color:#666;">點擊即購買並套用</p>
    </div>

    <div class="game-ui">
        <div>分數: <span id="score-val">0</span></div>
        <div style="color:#00ffff">金幣: <span id="gold-val">0</span></div>
    </div>
    <div id="key-ui">🔑 <span id="key-count">0</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFsYaVluzHsQc3dxcTNieu514UdU-mj4A",
            authDomain: "fr-cube.firebaseapp.com",
            projectId: "fr-cube",
            storageBucket: "fr-cube.firebasestorage.app",
            messagingSenderId: "872650518894",
            appId: "1:872650518894:web:5de26c9c9fcfa1b611517f",
            measurementId: "G-0J5D3TSMBC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userDoc = null;
        let isGameActive = false;
        let goldCollected = 0, score = 0;

        const skinColors = { classic: 0x00ff88, emerald: 0x50C878, gold: 0xFFD700, shadow: 0x8A2BE2 };

        // 登入註冊邏輯
        window.toggleAuth = (isReg) => {
            document.getElementById('login-box').classList.toggle('hidden', isReg);
            document.getElementById('reg-box').classList.toggle('hidden', !isReg);
        };

        window.handleSignIn = async () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert("登入失敗"); }
        };

        window.handleSignUp = async () => {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), {
                    gold: 0, keys: 20, highScore: 0, 
                    skins: ['classic'], currentSkin: 'classic'
                });
            } catch (e) { alert("註冊失敗"); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                userDoc = snap.data();
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('shop-btn').classList.remove('hidden');
                updateUIDisplay();
                initGame();
            }
        });

        // 商店邏輯
        window.toggleShop = () => {
            const p = document.getElementById('shop-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        };

        window.buySkin = async (skinId, price) => {
            if (userDoc.skins.includes(skinId)) {
                applySkin(skinId);
                return;
            }
            if (userDoc.gold >= price) {
                const userRef = doc(db, "users", auth.currentUser.uid);
                await updateDoc(userRef, {
                    gold: increment(-price),
                    skins: arrayUnion(skinId),
                    currentSkin: skinId
                });
                userDoc.gold -= price;
                userDoc.skins.push(skinId);
                applySkin(skinId);
                updateUIDisplay();
                alert("解鎖成功！");
            } else { alert("金幣不足！"); }
        };

        function applySkin(skinId) {
            player.material.color.setHex(skinColors[skinId]);
            userDoc.currentSkin = skinId;
        }

        function updateUIDisplay() {
            document.getElementById('key-count').innerText = userDoc.keys;
            document.getElementById('gold-val').innerText = userDoc.gold;
        }

        // --- Three.js 核心 ---
        let scene, camera, renderer, player, obstacles = [], coins = [], animID;
        let targetLane = 0, gameSpeed = 0.6;

        function initGame() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            player = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshPhongMaterial({ color: skinColors[userDoc.currentSkin] }));
            player.position.y = 0.4;
            scene.add(player);

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 5);
            scene.add(light, new THREE.AmbientLight(0x444444));

            camera.position.set(0, 4, 7); camera.lookAt(0,0,0);
            
            window.ontouchstart = (e) => {
                const x = e.touches[0].clientX;
                if(x < window.innerWidth/2) { if(targetLane > -1) targetLane--; }
                else { if(targetLane < 1) targetLane++; }
            };

            isGameActive = true;
            animate();
        }

        function animate() {
            if(!isGameActive) return;
            animID = requestAnimationFrame(animate);
            gameSpeed += 0.0001;
            player.position.x += (targetLane * 2.5 - player.position.x) * 0.2;
            
            if(Math.random() < 0.05) spawn();
            
            obstacles.forEach((o, i) => {
                o.position.z += gameSpeed;
                if(o.position.z > 10) { scene.remove(o); obstacles.splice(i,1); score++; }
                if(player.position.distanceTo(o.position) < 0.8) endGame();
            });

            coins.forEach((c, i) => {
                c.position.z += gameSpeed;
                if(player.position.distanceTo(c.position) < 0.8) {
                    scene.remove(c); coins.splice(i,1);
                    goldCollected += 10;
                    document.getElementById('gold-val').innerText = userDoc.gold + goldCollected;
                }
            });
            document.getElementById('score-val').innerText = score;
            renderer.render(scene, camera);
        }

        function spawn() {
            const lane = [ -2.5, 0, 2.5 ][Math.floor(Math.random()*3)];
            if(Math.random() > 0.3) {
                const obs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1), new THREE.MeshPhongMaterial({color: 0xff4444}));
                obs.position.set(lane, 0.5, -60);
                scene.add(obs); obstacles.push(obs);
            } else {
                const c = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.1, 8, 16), new THREE.MeshPhongMaterial({color: 0xFFD700}));
                c.position.set(lane, 0.5, -60);
                scene.add(c); coins.push(c);
            }
        }

        async function endGame() {
            isGameActive = false;
            const userRef = doc(db, "users", auth.currentUser.uid);
            await updateDoc(userRef, { gold: increment(goldCollected) });
            alert(`結算！得分: ${score}, 獲得金幣: ${goldCollected}`);
            location.reload();
        }
    </script>
</body>
</html>
