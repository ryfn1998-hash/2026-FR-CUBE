<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暗影流線：極速進化</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #00ffff; font-size: 30px; font-weight: 900; text-shadow: 0 0 10px #00ffff; pointer-events: none; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: white; z-index: 100; }
        button { padding: 15px 40px; background: #8A2BE2; border: none; color: white; border-radius: 8px; cursor: pointer; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="ui">0</div>
    
    <div id="start-screen" class="overlay">
        <h1 style="color:#8A2BE2">暗影伺服器：流線控制</h1>
        <button onclick="startGame()">初始化連線</button>
    </div>

    <div id="death-screen" class="overlay" style="display:none">
        <h2 style="color:#ff4444">系統潰散</h2>
        <p id="final-score"></p>
        <button onclick="location.reload()">重新啟動</button>
    </div>

    <script>
        let scene, camera, renderer, player;
        let score = 0, isPlaying = false, speed = 0.5;
        let lane = 0, lanes = [-2.2, 0, 2.2];
        let obstacles = [];
        
        // --- 尾跡系統參數 ---
        const TRAIL_MAX_POINTS = 30; // 尾跡長度
        let trailPositions = []; // 儲存玩家路徑點
        let trailMesh;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 10, 70);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 地面與環境
            const grid = new THREE.GridHelper(1000, 100, 0x333333, 0x111111);
            scene.add(grid);

            // 玩家方塊
            player = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x8A2BE2, emissive: 0x8A2BE2 })
            );
            player.position.y = 0.4;
            scene.add(player);

            // 初始化「流線尾跡」
            initTrail();

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            window.addEventListener('touchstart', handleTouch);
            window.addEventListener('resize', onResize);
            
            animate();
        }

        function initTrail() {
            const geometry = new THREE.PlaneGeometry(0.7, 1, 1, TRAIL_MAX_POINTS - 1);
            const material = new THREE.MeshBasicMaterial({
                color: 0x8A2BE2,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            trailMesh = new THREE.Mesh(geometry, material);
            trailMesh.rotation.x = -Math.PI / 2;
            trailMesh.position.y = 0.05; // 貼地高度
            scene.add(trailMesh);

            // 預填座標
            for(let i=0; i < TRAIL_MAX_POINTS; i++) {
                trailPositions.push(new THREE.Vector3(0, 0, 0));
            }
        }

        function updateTrail() {
            // 將當前玩家位置加入隊列
            trailPositions.unshift(new THREE.Vector3(player.position.x, 0, player.position.z));
            if(trailPositions.length > TRAIL_MAX_POINTS) trailPositions.pop();

            const positions = trailMesh.geometry.attributes.position.array;
            
            for(let i = 0; i < TRAIL_MAX_POINTS; i++) {
                const p = trailPositions[i];
                const zOffset = i * speed * 0.8; // 讓尾跡隨速度向後延伸
                
                // 設定平面左右兩個點的座標
                const x = p ? p.x : 0;
                const z = p ? p.z + zOffset : 0;
                
                // 平面幾何體的頂點結構：左點, 右點, 左點, 右點...
                const width = 0.35 * (1 - i/TRAIL_MAX_POINTS); // 越往後越窄
                
                positions[i * 6 + 0] = -width; // 左點 X
                positions[i * 6 + 1] = z;      // 左點 Y (在平面坐標系中是深)
                
                positions[i * 6 + 3] = width;  // 右點 X
                positions[i * 6 + 4] = z;      // 右點 Y
            }
            trailMesh.geometry.attributes.position.needsUpdate = true;
            trailMesh.position.x = player.position.x; // 跟隨玩家 X
            trailMesh.position.z = player.position.z; // 跟隨玩家 Z
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!isPlaying) { renderer.render(scene, camera); return; }

            // 速度控制
            speed = 0.5 + (score * 0.005);
            player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[lane+1], 0.15);

            updateTrail();
            updateObstacles();

            renderer.render(scene, camera);
        }

        function spawnObstacle() {
            if(Math.random() > 0.05) return;
            const obs = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1, 1),
                new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff })
            );
            obs.position.set(lanes[Math.floor(Math.random()*3)], 0.5, -80);
            scene.add(obs);
            obstacles.push(obs);
        }

        function updateObstacles() {
            spawnObstacle();
            for(let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.position.z += speed;

                // 碰撞檢測
                if(player.position.distanceTo(o.position) < 0.8) {
                    isPlaying = false;
                    document.getElementById('death-screen').style.display = 'flex';
                    document.getElementById('final-score').innerText = `連線積分：${score}`;
                }

                if(o.position.z > 10) {
                    scene.remove(o);
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('ui').innerText = score;
                }
            }
        }

        function handleTouch(e) {
            const x = e.touches[0].clientX;
            lane = x < window.innerWidth/2 ? Math.max(-1, lane-1) : Math.min(1, lane+1);
        }

        function startGame() {
            isPlaying = true;
            document.getElementById('start-screen').style.display = 'none';
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
