<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 FR CUBE - ID System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #00ff88; --bg: #050505; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; }
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 8000; backdrop-filter: blur(10px); }
        .panel { padding: 30px; background: rgba(15,15,15,0.95); border: 1px solid var(--neon); border-radius: 20px; text-align: center; width: 320px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center; }
        .btn { width: 100%; padding: 12px; background: var(--neon); border: none; color: #000; cursor: pointer; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        .game-ui { position: absolute; top: 25px; left: 25px; z-index: 100; color: var(--neon); font-weight: bold; }
        .hidden { display: none !important; }
        .status-msg { font-size: 12px; margin-top: 10px; min-height: 15px; color: #ff4444; }
    </style>
</head>
<body>

    <!-- ID 驗證系統 -->
    <div id="auth-screen" class="overlay">
        <!-- 登入介面 -->
        <div id="login-box" class="panel">
            <h2 style="color:var(--neon);">2026 FR CUBE</h2>
            <p style="font-size:12px; color:#666;">請輸入您的玩家 ID 登入</p>
            <input type="text" id="login-id" placeholder="玩家 ID">
            <input type="password" id="login-pass" placeholder="存取密碼">
            <button class="btn" onclick="handleSignIn()">同步連線</button>
            <button class="btn" style="background:transparent; border:1px solid #444; color:#aaa;" onclick="toggleAuth(true)">建立新 ID</button>
            <div id="login-status" class="status-msg"></div>
        </div>

        <!-- 註冊介面 -->
        <div id="reg-box" class="panel hidden">
            <h2 style="color:#00ffff;">自定義玩家 ID</h2>
            <p style="font-size:12px; color:#666;">註冊後 ID 無法更改</p>
            <input type="text" id="reg-id" placeholder="設定玩家 ID (英文/數字)">
            <input type="password" id="reg-pass" placeholder="設定密碼 (至少6位)">
            <button class="btn" style="background:#00ffff" onclick="handleSignUp()">確認註冊</button>
            <button class="btn" style="background:transparent; border:1px solid #444; color:#aaa;" onclick="toggleAuth(false)">返回登入</button>
            <div id="reg-status" class="status-msg"></div>
        </div>
    </div>

    <div class="game-ui">
        <div>ID: <span id="display-id">---</span></div>
        <div style="color:#00ffff">金幣: <span id="gold-val">0</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDFsYaVluzHsQc3dxcTNieu514UdU-mj4A",
            authDomain: "fr-cube.firebaseapp.com",
            projectId: "fr-cube",
            storageBucket: "fr-cube.firebasestorage.app",
            messagingSenderId: "872650518894",
            appId: "1:872650518894:web:5de26c9c9fcfa1b611517f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 將 ID 轉換為 Firebase 可接受的 Email 格式
        const formatID = (id) => `${id.trim().toLowerCase()}@fr.cube`;

        window.toggleAuth = (isReg) => {
            document.getElementById('login-box').classList.toggle('hidden', isReg);
            document.getElementById('reg-box').classList.toggle('hidden', !isReg);
        };

        // ID 登入
        window.handleSignIn = async () => {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            const status = document.getElementById('login-status');
            
            if(!id || !pass) { status.innerText = "請輸入完整資訊"; return; }

            try {
                await signInWithEmailAndPassword(auth, formatID(id), pass);
            } catch (e) {
                status.innerText = "ID 或密碼錯誤，或該 ID 尚未註冊";
            }
        };

        // ID 註冊
        window.handleSignUp = async () => {
            const id = document.getElementById('reg-id').value;
            const pass = document.getElementById('reg-pass').value;
            const status = document.getElementById('reg-status');

            if(id.length < 3) { status.innerText = "ID 長度太短"; return; }
            if(pass.length < 6) { status.innerText = "密碼至少 6 位"; return; }

            try {
                const res = await createUserWithEmailAndPassword(auth, formatID(id), pass);
                await setDoc(doc(db, "users", res.user.uid), {
                    playerID: id,
                    gold: 0,
                    keys: 20,
                    skins: ['classic'],
                    currentSkin: 'classic'
                });
            } catch (e) {
                if(e.code === 'auth/email-already-in-use') status.innerText = "此 ID 已被佔用";
                else status.innerText = "註冊失敗，請換個 ID 試試";
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                const data = snap.data();
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('display-id').innerText = data.playerID;
                document.getElementById('gold-val').innerText = data.gold;
                // 此處接續你的 initGame()...
            }
        });
    </script>
</body>
</html>
